<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GameVault — Game details</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .detail-hero{padding:2.5rem 2rem;border-bottom:1px solid var(--border)}
    .detail-inner{max-width:1180px;margin:0 auto;display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap}
    .detail-cover{width:220px;height:220px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:80px;flex-shrink:0;box-shadow:0 20px 50px rgba(0,0,0,.5)}
    .detail-title h1{font-size:28px;font-weight:800;color:white;margin-bottom:8px}
    .detail-title .tagline{color:var(--muted);font-size:15px;margin-bottom:14px}
    .detail-price{font-size:26px;font-weight:800;color:var(--accent);margin-bottom:16px}
    .screenshots{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:2rem}
    .shot{height:110px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:rgba(255,255,255,.35);border:1px solid var(--border)}
    .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
    .tabs button{background:none;border:none;color:var(--muted);padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;border-bottom:2px solid transparent}
    .tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-panel{display:none;color:var(--muted);font-size:14px;line-height:1.7}
    .tab-panel.active{display:block}
    .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="store.html"><div class="logo-mark">🎮</div>GameVault</a>
  <div class="nav-links">
    <a href="store.html">Store</a>
    <a href="cart.html">Cart</a>
    <a href="px-events.html">PX Events</a>
  </div>
  <div class="nav-user">
    <a class="cart-link" href="cart.html">🛒<span class="cart-badge" id="cart-badge" style="display:none;">0</span></a>
    <div class="avatar" id="nav-avatar">A</div>
    <span class="nav-name" id="nav-name"></span>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</nav>

<div class="detail-hero" id="detail-hero"></div>

<div class="page-content">
  <div class="tabs" role="tablist">
    <button class="active" data-tab="overview">Overview</button>
    <button data-tab="requirements">Requirements</button>
    <button data-tab="reviews">Reviews</button>
  </div>
  <div class="tab-panel active" id="tab-overview"></div>
  <div class="tab-panel" id="tab-requirements">
    <p><b>Minimum:</b> 8GB RAM, quad-core CPU, 6GB storage, DirectX 11 GPU.<br/>
       <b>Recommended:</b> 16GB RAM, 6-core CPU, SSD, DirectX 12 GPU with 6GB VRAM.</p>
  </div>
  <div class="tab-panel" id="tab-reviews">
    <div class="card" style="margin-bottom:14px;">
      <div class="inp-group" style="margin-bottom:10px;">
        <label>Leave a review</label>
        <textarea id="review-text" placeholder="What did you think?"></textarea>
      </div>
      <button class="btn btn-outline btn-sm" onclick="submitReview()">✍️ Submit review</button>
    </div>
    <p style="color:var(--muted);font-size:13px;">Submitting fires a <code>review_submitted</code> PX track event.</p>
  </div>

  <div class="section-header" style="margin-top:2.5rem;"><h3>You might also like</h3></div>
  <div class="related-grid" id="related-grid"></div>
</div>

<div class="toast" id="toast"><div class="t-title" id="toast-title"></div><div class="t-sub" id="toast-sub"></div></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
  var user = requireAuth();
  if (user) populateNav(user);

  var id = new URLSearchParams(window.location.search).get('id');
  var game = getGame(id) || GAMES[0];

  document.title = 'GameVault — ' + game.title;

  document.getElementById('detail-hero').innerHTML =
    '<div class="detail-inner">' +
      '<div class="detail-cover" style="' + coverStyle(game.genre) + '">' + game.icon + '</div>' +
      '<div class="detail-title" style="flex:1;min-width:240px;">' +
        genreTagHtml(game.genre) +
        '<h1 style="margin-top:10px;">' + game.title + '</h1>' +
        '<div class="tagline">' + game.tagline + '</div>' +
        '<div class="detail-price">$' + game.price.toFixed(2) + '</div>' +
        '<div class="btn-grid">' +
          '<button class="btn btn-primary btn-lg" id="buy-btn">🛒 Add to Cart</button>' +
          '<button class="btn btn-outline" id="wishlist-btn">💜 Add to Wishlist</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('tab-overview').innerHTML =
    '<p style="margin-bottom:16px;">' + game.description + '</p>' +
    '<div class="screenshots">' +
      '<div class="shot" style="' + coverStyle(game.genre) + '">🖼️</div>' +
      '<div class="shot" style="' + coverStyle(game.genre) + '">🖼️</div>' +
      '<div class="shot" style="' + coverStyle(game.genre) + '">🖼️</div>' +
    '</div>';

  document.getElementById('buy-btn').addEventListener('click', function () { addToCart(game); });
  document.getElementById('wishlist-btn').addEventListener('click', function () {
    trackPX('wishlist_added', { gameId: game.id, title: game.title, genre: game.genre });
  });

  trackPX('game_viewed', { gameId: game.id, title: game.title, genre: game.genre, source: 'detail_page' });

  document.querySelectorAll('.tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
      this.classList.add('active');
      document.getElementById('tab-' + this.dataset.tab).classList.add('active');
    });
  });

  function submitReview() {
    var text = document.getElementById('review-text').value.trim();
    if (!text) { showToast('⚠️ Write something first', ''); return; }
    trackPX('review_submitted', { gameId: game.id, title: game.title, length: text.length });
    document.getElementById('review-text').value = '';
  }

  var related = document.getElementById('related-grid');
  GAMES.filter(function(g){ return g.genre === game.genre && g.id !== game.id; })
    .concat(GAMES.filter(function(g){ return g.genre !== game.genre; }))
    .slice(0, 4)
    .forEach(function (g) {
      var a = document.createElement('a');
      a.className = 'game-card';
      a.href = 'game-detail.html?id=' + g.id;
      a.innerHTML =
        '<div class="game-cover" style="' + coverStyle(g.genre) + '">' +
          '<span class="cover-badge">' + genreTagHtml(g.genre) + '</span>' + g.icon +
          '<span class="cover-price">$' + g.price.toFixed(2) + '</span>' +
        '</div>' +
        '<div class="game-info"><h4>' + g.title + '</h4><p>' + g.tagline + '</p></div>';
      related.appendChild(a);
    });
</script>
</body>
</html>
